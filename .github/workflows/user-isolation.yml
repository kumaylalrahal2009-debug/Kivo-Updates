name: Kivo User Isolation

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "core-runtime.js"
      - "bootstrap.js"
      - "experience.js"
      - "smart-experience-v2.js"
      - "scripts/user-isolation-smoke.js"
      - ".github/workflows/user-isolation.yml"
  workflow_dispatch:

concurrency:
  group: kivo-user-isolation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolate-users:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Get Kivo source
        uses: actions/checkout@v5
      - name: Validate isolation test source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check core-runtime.js
          node --check smart-experience-v2.js
          node --check scripts/user-isolation-smoke.js
      - name: Attack account boundaries on temporary data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/user-isolation-smoke.js
