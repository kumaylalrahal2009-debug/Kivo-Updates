name: Publish Kivo Update

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
      - "*.txt"
      - "data/**"
      - "uploads/**"
      - "updates/**"
      - "backups/**"
  workflow_dispatch:

concurrency:
  group: kivo-latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 26

    steps:
      - name: Get Kivo source
        uses: actions/checkout@v5

      - name: Validate Kivo source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check secure-gateway.js
          node --check server.js
          node --check core-runtime.js
          node --check force-loopback.js
          node --check bootstrap.js
          node --check experience.js
          node --check smart-experience.js
          node --check smart-experience-v2.js
          node --check lib/update-engine.js
          node --check lib/account-service.js
          node --check public/app.js
          node --check public/premium.js
          node --check public/smart-client.js
          node --check public/money-intelligence.js
          node --check public/account-controls.js
          node --check public/sw.js
          node --check scripts/release-smoke.js
          node --check scripts/capture-parser-smoke.js
          node --check scripts/integration-smoke.js
          node --check scripts/update-integrity-smoke.js
          node --check scripts/account-lifecycle-smoke.js
          node --check scripts/user-isolation-smoke.js
          node --check scripts/billing-webhook-smoke.js
          node --check scripts/security-gateway-smoke.js
          node scripts/release-smoke.js

          $required = @(
            "secure-gateway.js",
            "server.js",
            "core-runtime.js",
            "force-loopback.js",
            "bootstrap.js",
            "experience.js",
            "smart-experience-v2.js",
            "lib/update-engine.js",
            "lib/account-service.js",
            "public/index.html",
            "public/app.js",
            "public/styles.css",
            "public/premium.js",
            "public/premium.css",
            "public/smart-client.js",
            "public/smart-ui.css",
            "public/money-intelligence.js",
            "public/account-controls.js",
            "public/manifest.json",
            "public/sw.js",
            "start-kivo.bat",
            "apply-update.ps1",
            "ensure-local-config.ps1",
            "show-owner-login.bat",
            "scripts/release-smoke.js",
            "scripts/capture-parser-smoke.js",
            "scripts/integration-smoke.js",
            "scripts/update-integrity-smoke.js",
            "scripts/account-lifecycle-smoke.js",
            "scripts/user-isolation-smoke.js",
            "scripts/billing-webhook-smoke.js",
            "scripts/security-gateway-smoke.js"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Required Kivo file missing: $item" }
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ensure-local-config.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "ensure-local-config.ps1 failed PowerShell parsing." }

      - name: Fuzz human capture parsing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/capture-parser-smoke.js

      - name: Attack public security gateway
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/security-gateway-smoke.js

      - name: Test update integrity engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/update-integrity-smoke.js

      - name: Boot and test real Kivo product
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/integration-smoke.js

      - name: Test account and privacy lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/account-lifecycle-smoke.js

      - name: Attack cross-user data isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/user-isolation-smoke.js

      - name: Test subscription and revenue lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/billing-webhook-smoke.js

      - name: Build and inspect update package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.${{ github.run_number }}"
          $tag = "v$version"

          New-Item -ItemType Directory -Force -Path dist\package | Out-Null

          $items = @(
            "secure-gateway.js",
            "server.js",
            "core-runtime.js",
            "force-loopback.js",
            "bootstrap.js",
            "experience.js",
            "smart-experience.js",
            "smart-experience-v2.js",
            "lib",
            "public",
            "start-kivo.bat",
            "start-admin.bat",
            "show-owner-login.bat",
            "ensure-local-config.ps1",
            "apply-update.ps1",
            "business-config.example.bat",
            "Dockerfile",
            "docker-compose.yml",
            ".env.example",
            "README.txt",
            "BILLING_SETUP.md"
          )

          foreach ($item in $items) {
            if (Test-Path $item) { Copy-Item $item dist\package -Recurse -Force }
          }

          @{
            version = $version
            update_repo = "${{ github.repository }}"
            release = $tag
            commit = "${{ github.sha }}"
            security_gateway = $true
            security_gateway_tested = $true
            capture_parser_tested = $true
            smart_experience = "v2"
            update_engine = "v2"
            secure_core = $true
            first_run_owner_setup = $true
            e2e_tested = $true
            account_lifecycle_tested = $true
            user_isolation_tested = $true
            billing_lifecycle_tested = $true
            checksum = "sha256"
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content dist\package\version.json -Encoding UTF8

          Compress-Archive -Path dist\package\* -DestinationPath dist\Kivo-update.zip -Force
          if ((Get-Item dist\Kivo-update.zip).Length -lt 1024) { throw "Kivo update package is unexpectedly small." }

          $verify = Join-Path $PWD "dist\verify"
          Expand-Archive -Path dist\Kivo-update.zip -DestinationPath $verify -Force
          foreach ($relative in @(
            "version.json",
            "start-kivo.bat",
            "secure-gateway.js",
            "bootstrap.js",
            "core-runtime.js",
            "force-loopback.js",
            "smart-experience-v2.js",
            "lib\update-engine.js",
            "lib\account-service.js",
            "public\index.html",
            "public\app.js",
            "public\smart-client.js",
            "public\money-intelligence.js",
            "public\account-controls.js",
            "public\sw.js"
          )) {
            if (-not (Test-Path (Join-Path $verify $relative))) { throw "Final release ZIP is missing $relative" }
          }
          foreach ($private in @("data","uploads","updates","backups","business-config.bat","owner-login.txt",".env")) {
            if (Test-Path (Join-Path $verify $private)) { throw "Private runtime content leaked into release ZIP: $private" }
          }

          $digest = (Get-FileHash dist\Kivo-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  Kivo-update.zip" | Set-Content dist\Kivo-update.sha256.txt -Encoding ASCII
          Write-Host "Kivo update SHA-256: $digest"

          "KIVO_VERSION=$version" >> $env:GITHUB_ENV
          "KIVO_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release create "$env:KIVO_TAG" `
            "dist/Kivo-update.zip#Kivo update package" `
            "dist/Kivo-update.sha256.txt#SHA-256 checksum" `
            --title "Kivo $env:KIVO_VERSION" `
            --generate-notes `
            --latest
