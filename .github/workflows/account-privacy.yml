name: Kivo Account & Privacy

on:
  push:
    branches: [main]
    paths:
      - "secure-gateway.js"
      - "lib/account-service.js"
      - "server.js"
      - "bootstrap.js"
      - "experience.js"
      - "smart-experience-v2.js"
      - "public/account-controls.js"
      - "scripts/account-lifecycle-smoke.js"
      - ".github/workflows/account-privacy.yml"
  workflow_dispatch:

concurrency:
  group: kivo-account-privacy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  account-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Get Kivo source
        uses: actions/checkout@v5

      - name: Validate account-control source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check secure-gateway.js
          node --check lib/account-service.js
          node --check public/account-controls.js
          node --check scripts/account-lifecycle-smoke.js

          foreach ($file in @(
            "secure-gateway.js",
            "lib/account-service.js",
            "public/account-controls.js",
            "scripts/account-lifecycle-smoke.js"
          )) {
            if (-not (Test-Path $file)) { throw "Required privacy/account file missing: $file" }
          }

          $gateway = Get-Content secure-gateway.js -Raw
          if ($gateway -notmatch "createAccountService") { throw "Kivo gateway is not wired to the account privacy service" }
          if ($gateway -notmatch "account-controls\.js") { throw "Kivo live app bundle is not loading account-controls.js" }

      - name: Run destructive account lifecycle on temporary data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/account-lifecycle-smoke.js
