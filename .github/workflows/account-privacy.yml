name: Kivo Account & Privacy

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "core-runtime.js"
      - "bootstrap.js"
      - "experience.js"
      - "smart-experience-v2.js"
      - "public/account-controls.js"
      - "public/index.html"
      - "scripts/account-lifecycle-smoke.js"
      - ".github/workflows/account-privacy.yml"
  workflow_dispatch:

concurrency:
  group: kivo-account-privacy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  account-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Get Kivo source
        uses: actions/checkout@v5

      - name: Validate account-control source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check core-runtime.js
          node --check bootstrap.js
          node --check smart-experience-v2.js
          node --check public/account-controls.js
          node --check scripts/account-lifecycle-smoke.js

          foreach ($file in @(
            "public/account-controls.js",
            "scripts/account-lifecycle-smoke.js",
            "core-runtime.js"
          )) {
            if (-not (Test-Path $file)) { throw "Required privacy/account file missing: $file" }
          }

          $html = Get-Content public/index.html -Raw
          if ($html -notmatch "account-controls\.js") { throw "Kivo UI is not loading account-controls.js" }

      - name: Run destructive account lifecycle on temporary data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/account-lifecycle-smoke.js
